<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flash USDT project access and community link. This unofficial project is not affiliated with Tether. Never share wallet secrets.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Flash USDT | Project Access">
  <meta property="og:description" content="Open the Flash USDT project Telegram. Unofficial project; never share wallet secrets.">
  <meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/USDT_Logo.png">
  <meta property="og:image:alt" content="Tether USDT logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Flash USDT | Project Access">
  <meta name="twitter:description" content="Open the Flash USDT project Telegram. Unofficial project; never share wallet secrets.">
  <meta name="twitter:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/USDT_Logo.png">
  <title>Flash USDT | Project Access</title>
  <link rel="icon" href="https://commons.wikimedia.org/wiki/Special:FilePath/USDT_Logo.png?width=64">
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #f5f5f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: #050505;
    }

    main {
      width: min(100%, 360px);
      text-align: center;
      animation: arrive 500ms ease-out both;
    }

    .logo {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      font-weight: 650;
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 28px;
      color: #a5a5a5;
      font-size: 14px;
      line-height: 1.5;
    }

    form { text-align: left; }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dedede;
      font-size: 13px;
    }

    input, button {
      width: 100%;
      min-height: 48px;
      border-radius: 5px;
      font: inherit;
    }

    input {
      margin-bottom: 12px;
      padding: 0 13px;
      border: 1px solid #424242;
      background: #111;
      color: #fff;
    }

    input:focus-visible, button:focus-visible {
      outline: 2px solid #50af95;
      outline-offset: 3px;
    }

    button {
      border: 0;
      background: #50af95;
      color: #06110e;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #68c5aa; }

    .notice {
      margin: 18px 0 0;
      color: #898989;
      font-size: 12px;
      line-height: 1.55;
    }

    .notice strong { color: #c5c5c5; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="https://commons.wikimedia.org/wiki/Special:FilePath/USDT_Logo.png?width=240"
      alt="Tether USDT logo"
      width="112"
      height="112"
      fetchpriority="high"
    >
    <h1>Flash USDT</h1>
    <p class="intro">Enter your project access code to continue to Telegram.</p>

    <form id="access-form">
      <label for="access-code">Project access code</label>
      <input
        id="access-code"
        name="access-code"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        required
        aria-describedby="key-notice"
      >
      <button type="submit">Access Telegram</button>
    </form>

    <p class="notice" id="key-notice"><strong>Important:</strong> This field is not sent or saved. Never enter a wallet password, private key, or recovery phrase. Flash USDT is not affiliated with Tether.</p>
  </main>
  <script>
    document.getElementById('access-form').addEventListener('submit', (event) => {
      event.preventDefault();
      window.location.assign('https://t.me/SheikhCoders');
    });
  </script>
</body>
</html>
